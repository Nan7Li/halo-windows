name: Desktop

# Tests the MyGo client and builds it for Windows, macOS and Linux. A tag
# desktop-v* also puts the builds in a draft release.
on:
  push:
    branches: [main]
    tags: ["desktop-v*"]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: desktop

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - run: go vet ./...
      - run: GOOS=windows go vet ./... && GOOS=darwin go vet ./...
      - run: go test ./...

  build:
    needs: test
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
          # Disk images need macOS. The app is not signed with a Developer
          # ID: the first launch needs a right click › Open.
          - { name: macOS, os: macos-latest, platform: "darwin/universal" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build
        run: go tool mygo build -platform "${{ matrix.platform }}" -skip-notarize
      - name: Collect the packages
        shell: bash
        run: |
          mkdir -p ../dist
          find build -mindepth 2 -maxdepth 2 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.tar.gz' -o -name 'install.sh' \) |
            while read -r f; do cp "$f" "../dist/$(basename "$(dirname "$f")")-$(basename "$f")"; done
          # The .app has no single file: zip it with its folder.
          for app in build/darwin-*/*.app; do
            [ -d "$app" ] && (cd "$(dirname "$app")" && ditto -c -k --keepParent "$(basename "$app")" "$GITHUB_WORKSPACE/dist/Halo-macOS.app.zip")
          done
          ls -la ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: halo-desktop-${{ matrix.name }}
          path: dist/*
      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Halo Desktop ${GITHUB_REF_NAME#desktop-v}" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" ../dist/* --clobber
